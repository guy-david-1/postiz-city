<style>
/* Layout: full-bleed 3D canvas with a thin arcade HUD floating at the corners. Single dark night-arcade look. */
:root{
  --bg:#170f2b; --ink:#fff7ec; --mute:#cbbfe6; --accent:#9b6bff; --hot:#ff5c7a; --gold:#ffc94d; --ok:#4fe3a1;
  --panel:rgba(23,14,46,.82); --line:rgba(255,255,255,.14);
  --fd:'Bungee',Impact,'Arial Black',system-ui,sans-serif; --fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fb);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:var(--fd);cursor:pointer;border:0;color:var(--bg);background:var(--gold);border-radius:6px;padding:12px 22px;font-size:18px;letter-spacing:.04em}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.eyebrow{font:700 12px/1.2 var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#mission{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));max-width:min(360px,52vw);background:var(--panel);border-left:4px solid var(--accent);padding:10px 14px;border-radius:4px}
#mTitle{font:14px/1.15 var(--fd);letter-spacing:.03em}
#mTitle small{display:block;font:700 10px var(--fb);letter-spacing:.16em;color:var(--gold);margin-bottom:3px}
#mObj{font:600 14px/1.35 var(--fb);color:var(--mute);margin-top:5px}
#ctop{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px}
#timer{font:26px/1 var(--fd);text-shadow:0 2px 0 #000a;font-variant-numeric:tabular-nums}
#timer.warn{color:var(--hot)}
#bars{display:flex;flex-direction:column;gap:5px;align-items:center}
.bar{width:min(300px,56vw);background:var(--panel);border-radius:4px;padding:6px 9px;font:700 12px var(--fb);font-variant-numeric:tabular-nums}
.bar .row{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.bar .track{height:8px;background:#ffffff1c;border-radius:4px;overflow:hidden;position:relative}
.bar .fill{height:100%;border-radius:4px;transition:width .15s}
.bar.alert{outline:2px solid var(--hot);animation:pulse .5s infinite alternate}
@keyframes pulse{to{outline-color:transparent}}
#compass{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:20px;padding:4px 10px 4px 6px;font:700 12px var(--fb)}
#arrow{width:22px;height:22px;display:grid;place-items:center;color:var(--gold);font-size:18px;transition:transform .08s linear}
#mini{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:150px;height:150px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 4px 18px #0007}
#speedo{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:right;text-shadow:0 2px 0 #000a}
#speedo b{font:40px/1 var(--fd);font-variant-numeric:tabular-nums}
#speedo span{display:block;font:700 11px var(--fb);letter-spacing:.2em;color:var(--mute)}
#prompt{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:4px;font:700 15px var(--fb)}
#prompt kbd{font:13px var(--fd);background:var(--gold);color:var(--bg);padding:2px 7px;border-radius:3px;margin-right:6px}
#sub{position:absolute;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(620px,90vw);text-align:center;font:700 18px/1.35 var(--fb);text-shadow:0 2px 4px #000,0 0 2px #000}
#sub b{color:var(--gold)}
#toast{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font:22px var(--fd);color:var(--gold);text-shadow:0 3px 0 #000a;white-space:nowrap;opacity:0;transition:opacity .2s}
#menuBtn,#muteBtn{position:absolute;pointer-events:auto;background:var(--panel);color:var(--ink);padding:7px 11px;font-size:14px;border-radius:4px}
#menuBtn{right:calc(176px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px))}
#muteBtn{right:calc(176px + env(safe-area-inset-right,0px));top:calc(52px + env(safe-area-inset-top,0px))}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .25s}
/* overlays */
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#title{background:linear-gradient(180deg,#170f2bcc 0%,#170f2b55 45%,#170f2bdd 100%)}
.tbox{max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.tbox h1{font:clamp(54px,13vw,104px)/.88 var(--fd);margin:0;color:var(--ink);text-shadow:0 6px 0 var(--accent),0 12px 30px #000}
.tbox h1 span{color:var(--gold)}
.tbox p{font:500 16px/1.5 var(--fb);color:var(--mute);margin:0;max-width:44ch;text-wrap:balance}
#play{font-size:26px;padding:16px 46px;box-shadow:0 6px 0 #b8872a}
#play:active{transform:translateY(3px);box-shadow:0 3px 0 #b8872a}
#chapters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#chapters button{font-size:12px;padding:8px 12px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.keys{font:500 13px/1.6 var(--fb);color:var(--mute)}
.keys b{font:12px var(--fd);color:var(--ink);background:#ffffff1a;padding:1px 6px;border-radius:3px}
#banner{pointer-events:none}
#banner .in{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
#banner h2{font:clamp(38px,9vw,72px)/1 var(--fd);margin:0;text-shadow:0 5px 0 #000a}
#banner.fail h2{color:var(--hot)}
#banner.ok h2{color:var(--ok)}
#banner p{font:700 18px var(--fb);margin:0;text-shadow:0 2px 4px #000;max-width:30ch}
#reveal{background:#0d0819aa}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;max-width:520px;padding:26px 28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #000a}
.card h3{font:24px/1.1 var(--fd);margin:0}
.card p{font:500 17px/1.55 var(--fb);margin:0;color:var(--ink)}
.card .src{font:500 12px var(--fb);color:var(--mute)}
.card button{align-self:flex-start}
/* touch */
#touch{position:fixed;inset:0;pointer-events:none}
#joyZone{position:absolute;left:0;bottom:0;width:46%;height:62%;pointer-events:auto}
#joyBase{position:absolute;width:120px;height:120px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff40;transform:translate(-50%,-50%);left:calc(90px + env(safe-area-inset-left,0px));bottom:30px;top:auto}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ffffffaa}
.tb{position:absolute;pointer-events:auto;width:74px;height:74px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;color:var(--ink);font:12px var(--fd);display:grid;place-items:center;padding:0}
.tb.on{background:#ffffff55}
#tbGas{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:88px;height:88px;background:#4fe3a133;border-color:#4fe3a1aa}
#tbBrake{right:calc(122px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#tbDrift{right:calc(122px + env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px))}
#tbCar{right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px));background:#ffc94d44;border-color:var(--gold)}
body.touch #speedo{bottom:auto;top:calc(172px + env(safe-area-inset-top,0px))}
body.touch #mini{width:112px;height:112px}
body.touch #menuBtn,body.touch #muteBtn{right:calc(14px + env(safe-area-inset-right,0px));top:calc(236px + env(safe-area-inset-top,0px))}
body.touch #muteBtn{top:calc(280px + env(safe-area-inset-top,0px))}
body.touch #speedo{top:calc(172px + env(safe-area-inset-top,0px))}
body.touch #prompt{display:none}
#tbCar.near{animation:glow .6s infinite alternate}
@keyframes glow{to{background:#ffc94daa;transform:scale(1.08)}}
body.touch #sub{bottom:calc(218px + env(safe-area-inset-bottom,0px));font-size:15px}
@media (max-width:640px){#ctop{top:calc(130px + env(safe-area-inset-top,0px))}.bar{width:52vw}#mission{max-width:46vw;padding:8px 10px}#mTitle{font-size:12px}#mObj{font-size:12px}#timer{font-size:20px}}
@media (prefers-reduced-motion:reduce){.bar.alert{animation:none}}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE;
const isTouch = (window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches) || (navigator.maxTouchPoints > 0 && !matchMedia('(hover: hover)').matches);

const $ = id => document.getElementById(id);

let seed = 1337; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

// ================= RENDERER / SCENE =================
const canvas = $('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
const FOGC = new T.Color('#f3c7b4');
scene.background = FOGC;
scene.fog = new T.Fog(FOGC, 120, 380);
const camera = new T.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 1000);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

let sky;
{ const g = new T.SphereGeometry(700, 24, 14); const pos = g.attributes.position; const cols = [];
  const top = new T.Color('#4f7fe0'), mid = new T.Color('#f7b796'), low = new T.Color('#f3c7b4');
  for (let i = 0; i < pos.count; i++) { const y = pos.getY(i) / 700; const c = y > 0 ? mid.clone().lerp(top, Math.min(1, y * 2.4)) : low.clone(); cols.push(c.r, c.g, c.b); }
  g.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  sky = new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false, depthWrite: false }));
  scene.add(sky);
  const sunDisc = new T.Mesh(new T.CircleGeometry(30, 24), new T.MeshBasicMaterial({ color: '#fff1c9', fog: false }));
  sunDisc.position.set(-380, 160, -420); sunDisc.lookAt(0, 0, 0); sky.add(sunDisc);
}
const hemi = new T.HemisphereLight('#eef2ff', '#b09378', 0.72); scene.add(hemi);
const sun = new T.DirectionalLight('#fff0d8', 0.82);
sun.castShadow = true; sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 320 });
sun.shadow.bias = -0.0006; scene.add(sun, sun.target);

// ================= MATERIALS / HELPERS =================
const matCache = {};
function M(color, extra) { const k = color + (extra ? JSON.stringify(extra) : ''); return matCache[k] || (matCache[k] = new T.MeshLambertMaterial(Object.assign({ color }, extra || {}))); }
function B(color) { const k = 'b' + color; return matCache[k] || (matCache[k] = new T.MeshBasicMaterial({ color })); }
function shade(hex, l) { const c = new T.Color(hex); c.offsetHSL(0, 0, l); return '#' + c.getHexString(); }
function bx(w, h, d, mat, x, y, z, parent, shadow = true) { const m = new T.Mesh(new T.BoxGeometry(w, h, d), typeof mat === 'string' ? M(mat) : mat); m.position.set(x, y, z); if (shadow) { m.castShadow = true; m.receiveShadow = true; } (parent || scene).add(m); return m; }
function cyl(rt, rb, h, seg, mat, x, y, z, parent) { const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg), typeof mat === 'string' ? M(mat) : mat); m.position.set(x, y, z); m.castShadow = true; (parent || scene).add(m); return m; }
function plane(w, d, mat, x, y, z, parent) { const g = new T.PlaneGeometry(w, d); g.rotateX(-Math.PI / 2); const m = new T.Mesh(g, typeof mat === 'string' ? M(mat) : mat); m.position.set(x, y, z); m.receiveShadow = true; (parent || scene).add(m); return m; }
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); draw(x, w, h); const t = new T.CanvasTexture(c); t.anisotropy = 4; return t; }
function labelTex(text, o = {}) {
  const w = o.w || 512, h = o.h || 128;
  return canvasTex(w, h, (x) => {
    x.fillStyle = o.bg || '#1b1033'; x.fillRect(0, 0, w, h);
    if (o.border) { x.strokeStyle = o.border; x.lineWidth = 10; x.strokeRect(5, 5, w - 10, h - 10); }
    x.fillStyle = o.fg || '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `${o.size || 64}px ${o.font || 'Bungee, Impact, sans-serif'}`;
    if (o.sub) { x.fillText(text, w / 2, h * 0.4, w - 30); x.font = `600 ${o.subSize || 24}px Inter, sans-serif`; x.fillStyle = o.subColor || o.fg || '#fff'; x.fillText(o.sub, w / 2, h * 0.78, w - 30); }
    else x.fillText(text, w / 2, h / 2 + 3, w - 30);
  });
}
function signMesh(tex, w, h, x, y, z, ry, parent) { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ map: tex, side: T.DoubleSide })); m.position.set(x, y, z); m.rotation.y = ry || 0; (parent || scene).add(m); return m; }
function textSprite(text, bg, fg, scale = 1) {
  const tex = canvasTex(512, 128, (x, w, h) => {
    x.fillStyle = bg; const r = 28; x.beginPath(); x.moveTo(r, 8); x.arcTo(w - 8, 8, w - 8, h - 8, r); x.arcTo(w - 8, h - 8, 8, h - 8, r); x.arcTo(8, h - 8, 8, 8, r); x.arcTo(8, 8, w - 8, 8, r); x.fill();
    x.fillStyle = fg; x.font = '600 40px Inter, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, h / 2 + 2, w - 40);
  });
  const s = new T.Sprite(new T.SpriteMaterial({ map: tex, depthTest: true, fog: false })); s.scale.set(8 * scale, 2 * scale, 1); return s;
}

// window texture (shared, tinted by material colour)
const winTex = canvasTex(256, 256, (x) => {
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 256, 256);
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const lit = Math.random() < 0.18;
    x.fillStyle = lit ? '#fff2b0' : (Math.random() < 0.5 ? '#3e4a6e' : '#4d5b82');
    x.fillRect(c * 32 + 6, r * 32 + 8, 20, 17);
    x.fillStyle = '#ffffff55'; x.fillRect(c * 32 + 6, r * 32 + 8, 20, 3);
  }
});
winTex.wrapS = winTex.wrapT = T.RepeatWrapping;
const wallMats = {};
function wallMat(c) { return wallMats[c] || (wallMats[c] = new T.MeshLambertMaterial({ color: c, map: winTex })); }

// ================= WORLD LAYOUT =================
const R = [-120, -60, 0, 60, 120], HW = 7, EDGE = 131, CZ0 = 24, CZ1 = 36;
const BX = [[-113, -67], [-53, -7], [7, 53], [67, 113]];
const colliders = [];
function addCol(x0, x1, z0, z1, h = 99, car = true, foot = true) { const c = { x0, x1, z0, z1, h, car, foot }; colliders.push(c); return c; }
const ramps = [];
function onVRoad(x) { for (const r of R) if (Math.abs(x - r) <= HW) return true; return false; }
function groundH(x, z) {
  let h = 0;
  if (z > CZ0 && z < CZ1 && !onVRoad(x) && Math.abs(x) < EDGE) h = -4;
  for (const r of ramps) { if (x > r.x0 && x < r.x1) { const t = (z - r.zl) / (r.zh - r.zl); if (t >= 0 && t <= 1) h = Math.max(h, t * r.h); } }
  return h;
}

const roadTex = canvasTex(64, 128, (x) => {
  x.fillStyle = '#3d3a4a'; x.fillRect(0, 0, 64, 128);
  for (let i = 0; i < 300; i++) { x.fillStyle = Math.random() < .5 ? '#45425380' : '#35324180'; x.fillRect(Math.random() * 64, Math.random() * 128, 2, 2); }
  x.fillStyle = '#e8e2d6'; x.fillRect(3, 0, 2, 128); x.fillRect(59, 0, 2, 128);
  x.fillStyle = '#ffc94d'; x.fillRect(30, 0, 4, 64);
});
roadTex.wrapS = roadTex.wrapT = T.RepeatWrapping; roadTex.repeat.set(1, 262 / 16);
const roadMat = new T.MeshLambertMaterial({ map: roadTex });

function buildWorld() {
  // ground (south + north of canal), canal, sea
  plane(262, 155, '#d9cdbd', 0, 0, -53.5);
  plane(262, 95, '#d9cdbd', 0, 0, 83.5);
  plane(262, 12, '#2a5a69', 0, -4, 30);
  const water = plane(2400, 2400, new T.MeshLambertMaterial({ color: '#3aa3c9' }), 0, -2.3, 0); water.receiveShadow = false;
  bx(262, 4, 0.6, '#8c8296', 0, -2, CZ0 + 0.3, null, false);
  bx(262, 4, 0.6, '#8c8296', 0, -2, CZ1 - 0.3, null, false);
  // sea walls + boundary colliders
  bx(263, 4.6, 0.8, '#8c8296', 0, -2, -EDGE - 0.4, null, false); bx(263, 4.6, 0.8, '#8c8296', 0, -2, EDGE + 0.4, null, false);
  bx(0.8, 4.6, 263, '#8c8296', -EDGE - 0.4, -2, 0, null, false); bx(0.8, 4.6, 263, '#8c8296', EDGE + 0.4, -2, 0, null, false);
  for (const s of [-1, 1]) { bx(263, 0.9, 0.3, '#f3efe6', 0, 0.45, s * (EDGE - 0.2), null, false); bx(0.3, 0.9, 263, '#f3efe6', s * (EDGE - 0.2), 0.45, 0, null, false); }

  AU.eng.f.frequency.setTargetAtTime(380 + (P.inCar ? Math.max(0, input.throttle) * 900 : 0) + sp * 18, t, 0.05);
  const live = gstate === 'play' || gstate === 'free' || gstate === 'passed';
  const near = P.inCar ? 1 : Math.max(0, 1 - Math.hypot(P.x - V.x, P.z - V.z) / 25) * 0.5;

}

// ================= HUD =================
const mini = $('mini'), mctx = mini.getContext('2d');
const mapBase = document.createElement('canvas'); mapBase.width = mapBase.height = 300;
const MS = 300 / 290; const mx = x => 150 + x * MS, mz = z => 150 + z * MS;
{
  const c = mapBase.getContext('2d'); c.fillStyle = '#2b78a0'; c.fillRect(0, 0, 300, 300);
  c.fillStyle = '#3a2d5c'; c.fillRect(mx(-131), mz(-131), 262 * MS, 262 * MS);
  c.fillStyle = '#3f7d5c'; c.fillRect(mx(-53), mz(7), 46 * MS, 46 * MS); c.fillRect(mx(-113), mz(-113), 46 * MS, 46 * MS);
  c.fillStyle = '#6a5a45'; c.fillRect(mx(67), mz(67), 46 * MS, 46 * MS);
  c.fillStyle = '#5c5480'; c.fillRect(mx(67), mz(-53), 46 * MS, 46 * MS);
  c.fillStyle = '#3aa3c9'; c.fillRect(mx(-131), mz(CZ0), 262 * MS, 12 * MS);
  c.fillStyle = '#a99ccf'; for (const r of R) { c.fillRect(mx(r - 7), mz(-131), 14 * MS, 262 * MS); c.fillRect(mx(-131), mz(r - 7), 262 * MS, 14 * MS); }
  c.fillStyle = '#9b6bff'; c.fillRect(mx(9), mz(-26.5), 17.5 * MS, 17.5 * MS);
  c.fillStyle = '#ffc94d'; c.fillRect(mx(-69), mz(-37), 18 * MS, 14 * MS);
}
let hudT = 0;
function updateHUD(dt) {
  if (subT > 0) { subT -= dt; if (subT <= 0) nextSub(); }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.opacity = 0; }
  hudT -= dt; if (hudT > 0) return; hudT = 0.08;
  $('spd').textContent = P.inCar ? Math.round(Math.abs(V.vF) * 3.6) : Math.round(Math.hypot(P.vx, P.vz) * 3.6);
  $('bars').innerHTML = (gstate === 'play' || gstate === 'passed') && CUR ? CUR.hud(ms) : '';
  // prompt
  const pr = $('prompt');
  if (!P.inCar && (gstate === 'play' || gstate === 'free') && Math.hypot(P.x - V.x, P.z - V.z) < 5) { pr.hidden = false; pr.innerHTML = isTouch ? 'Tap <kbd>CAR</kbd> to drive' : '<kbd>E</kbd> Get in the van'; }
  else pr.hidden = true;
  if (isTouch) { $('tbCar').classList.toggle('near', !P.inCar && Math.hypot(P.x - V.x, P.z - V.z) < 5); $('tbCar').textContent = P.inCar ? 'EXIT' : 'CAR'; $('tbGas').textContent = P.inCar ? 'GAS' : 'JUMP'; $('tbBrake').hidden = !P.inCar; $('tbDrift').hidden = !P.inCar; }
  // compass
  const px = P.inCar ? V.x : P.x, pz = P.inCar ? V.z : P.z;
  let best = null; for (const t of targets) { const d = Math.hypot(t.x - px, t.z - pz); if (!best || d < best.d) best = { ...t, d }; }
  const cp = $('compass');
  if (best && gstate === 'play') { cp.hidden = false; const a = Math.atan2(best.x - px, best.z - pz); const rel = angDiff(camYaw, a); $('arrow').style.transform = `rotate(${-rel}rad)`; $('arrow').style.color = best.c; $('cdist').textContent = Math.round(best.d) + ' m'; }
  else cp.hidden = true;

  if (floatObj.g.visible) { mctx.fillStyle = '#ff5c7a'; mctx.beginPath(); mctx.arc(mx(F.x), mz(F.z), 7, 0, 7); mctx.fill(); }
  for (const t of targets) { mctx.fillStyle = t.c; mctx.strokeStyle = '#1b1033'; mctx.lineWidth = 3; mctx.beginPath(); mctx.arc(mx(t.x), mz(t.z), 8, 0, 7); mctx.fill(); mctx.stroke(); }

  const h = P.inCar ? V.h : P.face; mctx.save(); mctx.translate(mx(px), mz(pz)); mctx.rotate(-h + Math.PI);
  mctx.fillStyle = '#fff'; mctx.strokeStyle = '#1b1033'; mctx.lineWidth = 3; mctx.beginPath(); mctx.moveTo(0, -11); mctx.lineTo(8, 9); mctx.lineTo(0, 4); mctx.lineTo(-8, 9); mctx.closePath(); mctx.stroke(); mctx.fill(); mctx.restore();
}

// ================= MENU / TITLE =================
function buildChapters() {
  const un = store.get('pc_unlocked', 0); const c = $('chapters'); c.innerHTML = '';
  MISSIONS.forEach((m, i) => { if (i === 0 || i <= un) { const b = document.createElement('button'); b.textContent = `${i + 1} · ${m.title}`; b.onclick = () => { initAudio(); startMission(i); }; c.appendChild(b); } });
}
$('keysHelp').innerHTML = isTouch
  ? 'Left thumb: steer / walk · <b>GAS</b> <b>BRAKE</b> <b>DRIFT</b> · <b>CAR</b> to get in or out · drag the screen to look around'
  : '<b>WASD</b> drive / walk · <b>SPACE</b> handbrake drift / jump · <b>SHIFT</b> sprint · <b>E</b> enter / exit · <b>R</b> retry or reset van · <b>M</b> mute · drag to look';

if (muted) { $('muteBtn').textContent = '♪̸'; $('muteBtn').style.opacity = 0.5; }

// ================= LOOP =================
let last = performance.now(), titleT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (tick(dt)) renderer.render(scene, camera);
}
function tick(dt) {
  timeNow += dt;
  if (world.wheel) { world.wheel.rotation.z += dt * 0.25; world.wheel.children.forEach(c => { if (c.userData.cab) c.rotation.z = -world.wheel.rotation.z; }); }
  if (world.beacon) world.beacon.visible = Math.sin(timeNow * 4) > 0;
  for (const c of missionGroup.children) if (c.userData.ring) c.userData.ring.rotation.z += dt; else c.children.forEach(k => { if (k.userData && k.userData.ring) k.userData.ring.scale.setScalar(1 + Math.sin(timeNow * 4) * 0.08); });

    camera.position.set(Math.sin(titleT) * 95, 48, Math.cos(titleT) * 95 - 20); camera.lookAt(15, 10, -18); camera.fov = 60; camera.updateProjectionMatrix();
    poseVan(dt); sun.position.set(60, 90, 40); sun.target.position.set(0, 0, 0);
    return true;
  }
  const sim = gstate === 'play' || gstate === 'free' || gstate === 'passed';
  if (sim) {
    readInput();
    updateVan(dt / 2); updateVan(dt / 2);
    if (!P.inCar) updatePlayer(dt);
    updateTraffic(dt); updatePeds(dt);
    if (gstate === 'play' && CUR) CUR.update(dt, ms);
    if (!P.inCar) nevo.g.position.set(P.x, P.y, P.z);
  }
  poseVan(dt);
  if (vanArrow.visible) vanArrow.position.set(V.x, 4.2 + Math.sin(timeNow * 5) * 0.35, V.z), vanArrow.rotation.y += dt * 3;
  updateDebris(dt);
  if (gstate !== 'title') updateCamera(dt);
  const fx = P.inCar ? V.x : P.x, fz = P.inCar ? V.z : P.z;
  sun.position.set(fx + 45, 90, fz + 30); sun.target.position.set(fx, 0, fz); sky.position.copy(camera.position);
  updateAudio(); updateHUD(dt);
  return true;
}
function poseVan(dt) {
  const g = vanObj.g; g.position.set(V.x, V.y, V.z); g.rotation.y = V.h;
  const sp = Math.abs(V.vF);

  vanObj.body.rotation.x = V.grounded ? clamp(-V.accel * 0.0025, -0.06, 0.06) : clamp(-V.vy * 0.015, -0.2, 0.2);
